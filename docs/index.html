<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CuanCalc - Kalkulator HPP & Profit Shopee / TikTok Shop</title>
<link rel="manifest" href="/cuancalc/manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CuanCalc">
<link rel="apple-touch-icon" href="/cuancalc/CuanCalc_icon_under_256KB.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/cuancalc/sw.js');
    });
  }
</script>
<style>
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{margin:0;background:#0f172a;color:#f8fafc;padding:16px;display:flex;justify-content:center}
  .card{width:100%;max-width:440px;background:#1e293b;border-radius:16px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.4)}
  h1{font-size:1.25rem;margin:0 0 4px;color:#38bdf8}
  p.sub{font-size:.85rem;color:#94a3b8;margin:0 0 16px}
  label{display:block;font-size:.82rem;color:#cbd5e1;margin:10px 0 4px}
  input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:1rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .res{margin-top:18px;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:14px}
  .row{display:flex;justify-content:space-between;margin:6px 0;font-size:.9rem}
  .big{font-size:1.2rem;font-weight:700;color:#4ade80;border-top:1px solid #334155;padding-top:10px;margin-top:8px}
  .neg{color:#f87171}
  .ad-slot{margin-top:16px;padding:12px;border:1px dashed #475569;border-radius:10px;text-align:center;font-size:.75rem;color:#64748b}
  button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:10px;background:#0284c7;color:#fff;font-weight:600;font-size:.95rem;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h1>CuanCalc Indonesia</h1>
  <p class="sub">Hitung HPP, Biaya Admin Marketplace & Profit Bersih</p>

  <label>Modal Produk / HPP (Rp)</label>
  <input type="number" id="hpp" value="35000" oninput="calc()">

  <label>Biaya Packing & Operasional (Rp)</label>
  <input type="number" id="pack" value="2500" oninput="calc()">

  <div class="grid">
    <div>
      <label>Admin + Layanan (%)</label>
      <input type="number" id="admin" value="8.5" step="0.1" oninput="calc()">
    </div>
    <div>
      <label>Komisi Affiliate (%)</label>
      <input type="number" id="aff" value="5" step="0.1" oninput="calc()">
    </div>
  </div>

  <label>Target Harga Jual (Rp)</label>
  <input type="number" id="sell" value="65000" oninput="calc()">

  <div class="res">
    <div class="row"><span>Total Potongan Fee:</span><span id="totFee">Rp 0</span></div>
    <div class="row"><span>Dana Cair ke Saldo:</span><span id="cair">Rp 0</span></div>
    <div class="row"><span>Margin Profit:</span><span id="margin">0%</span></div>
    <div class="row big"><span>Profit Bersih / Pcs:</span><span id="profit">Rp 0</span></div>
  </div>

  <button onclick="copySummary()">Salin Rincian ke WhatsApp</button>
  <div class="ad-slot" id="ad-banner" style="display:flex;justify-content:center;align-items:center;min-height:50px;">
  <script>
    atOptions = {
      'key' : '024d2a92a26d104e485c9e71c08c29f5',
      'format' : 'iframe',
      'height' : 50,
      'width' : 320,
      'params' : {}
    };
  </script>
  <script src="https://bicea.org/22/024d2a92a26d104e485c9e71c08c29f5/invoke.js"></script>
  </div>
</div>

<script>
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
function calc(){
  const hpp = +document.getElementById('hpp').value || 0;
  const pack = +document.getElementById('pack').value || 0;
  const admin = +document.getElementById('admin').value || 0;
  const aff = +document.getElementById('aff').value || 0;
  const sell = +document.getElementById('sell').value || 0;

  const fee = sell * ((admin + aff) / 100);
  const cair = sell - fee;
  const profit = cair - hpp - pack;
  const margin = sell > 0 ? (profit / sell) * 100 : 0;

  document.getElementById('totFee').textContent = rp(fee);
  document.getElementById('cair').textContent = rp(cair);
  document.getElementById('margin').textContent = margin.toFixed(1) + '%';
  const pEl = document.getElementById('profit');
  pEl.textContent = rp(profit);
  pEl.className = profit < 0 ? 'neg' : '';
}
function copySummary(){
  const sell = document.getElementById('sell').value;
  const profit = document.getElementById('profit').textContent;
  const margin = document.getElementById('margin').textContent;
  const txt = `Simulasi CuanCalc:\nHarga Jual: Rp ${Number(sell).toLocaleString('id-ID')}\nProfit Bersih: ${profit} (${margin})`;
  navigator.clipboard.writeText(txt);
  alert('Rincian disalin!');
}
calc();
</script>
<script src="https://bicea.org/43/c7/1a/43c71aa52c2b6d90de07fd352c62939d.js"></script>
</body>
</html>
